# DAPLink / CMSIS-DAP probe configuration for OpenOCD 0.12
# Used by .vscode/launch.json (Cortex-Debug).
#
# The wireless CMSIS-DAP link is not stable at high SWD clock.
# 500 kHz is a safe starting point; raise it after the link is stable.

source [find interface/cmsis-dap.cfg]

transport select swd

source [find target/stm32f4x.cfg]

# NOTE: stm32f4x.cfg itself sets "adapter speed 2000", so this line must
# come AFTER the target config, otherwise it gets overridden.
adapter speed 500
